name: Deploy GrainTrade

on:
  push:
    branches:
      - main
  merge_request:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      chat_room: ${{ steps.filter.outputs.chat_room }}
      notifications: ${{ steps.filter.outputs.notifications }}
      data_pipeline: ${{ steps.filter.outputs.data_pipeline }}
      landing_service: ${{ steps.filter.outputs.landing_service }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # First push case: treat as full build
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          echo "Changed files:"
          echo "${changed_files}"

          has_change() {
            local pattern="$1"
            if echo "${changed_files}" | grep -E -q "${pattern}"; then
              echo "true"
            else
              echo "false"
            fi
          }

          # Shared infra/config that should trigger all builds if changed
          shared="$(has_change '^(docker-compose\.prod\.yaml|docker-compose\.yaml|docker-compose\.dev\.yaml|\.gitea/workflows/deploy\.yaml)$')"

          backend="$(has_change '^backend/')"
          frontend="$(has_change '^frontend/')"
          chat_room="$(has_change '^chat-room/')"
          notifications="$(has_change '^notifications/')"
          data_pipeline="$(has_change '^data-pipeline/')"
          landing_service="$(has_change '^landing-service/')"

          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"
          echo "chat_room=${chat_room}" >> "$GITHUB_OUTPUT"
          echo "notifications=${notifications}" >> "$GITHUB_OUTPUT"
          echo "data_pipeline=${data_pipeline}" >> "$GITHUB_OUTPUT"
          echo "landing_service=${landing_service}" >> "$GITHUB_OUTPUT"
          echo "shared=${shared}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Gitea Registry
        run: docker login gitea.graintrade.info -u ${{ github.actor }} -p ${{ secrets.GITEATOKEN }}

      - name: Build & Push Backend
        if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.shared == 'true'
        run: |
          docker build -t gitea.graintrade.info/kivaschenko/grain-backend:${{ github.sha }} ./backend
          docker push gitea.graintrade.info/kivaschenko/grain-backend:${{ github.sha }}

      - name: Build & Push Frontend
        if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.shared == 'true'
        run: |
          docker build -t gitea.graintrade.info/kivaschenko/grain-frontend:${{ github.sha }} ./frontend
          docker push gitea.graintrade.info/kivaschenko/grain-frontend:${{ github.sha }}

      - name: Build & Push Chat Room
        if: needs.detect-changes.outputs.chat_room == 'true' || needs.detect-changes.outputs.shared == 'true'
        run: |
          docker build -t gitea.graintrade.info/kivaschenko/grain-chat-room:${{ github.sha }} ./chat-room
          docker push gitea.graintrade.info/kivaschenko/grain-chat-room:${{ github.sha }}

      - name: Build & Push Notifications
        if: needs.detect-changes.outputs.notifications == 'true' || needs.detect-changes.outputs.shared == 'true'
        run: |
          docker build -t gitea.graintrade.info/kivaschenko/grain-notifications:${{ github.sha }} ./notifications
          docker push gitea.graintrade.info/kivaschenko/grain-notifications:${{ github.sha }}

      - name: Build & Push Data Pipeline
        if: needs.detect-changes.outputs.data_pipeline == 'true' || needs.detect-changes.outputs.shared == 'true'
        run: |
          docker build -t gitea.graintrade.info/kivaschenko/grain-data-pipeline:${{ github.sha }} ./data-pipeline
          docker push gitea.graintrade.info/kivaschenko/grain-data-pipeline:${{ github.sha }}

      - name: Build & Push Landing Service
        if: needs.detect-changes.outputs.landing_service == 'true' || needs.detect-changes.outputs.shared == 'true'
        run: |
          docker build -t gitea.graintrade.info/kivaschenko/grain-landing-service:${{ github.sha }} ./landing-service
          docker push gitea.graintrade.info/kivaschenko/grain-landing-service:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH Key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to Production
        shell: bash
        run: |
          # Run if at least one service or shared config changed
          if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ] || [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ] || [ "${{ needs.detect-changes.outputs.chat_room }}" = "true" ] || [ "${{ needs.detect-changes.outputs.notifications }}" = "true" ] || [ "${{ needs.detect-changes.outputs.data_pipeline }}" = "true" ] || [ "${{ needs.detect-changes.outputs.landing_service }}" = "true" ] || [ "${{ needs.detect-changes.outputs.shared }}" = "true" ]; then
             echo "Changes detected, deploying to production..."
          else
             echo "No relevant changes detected, skipping deployment."
             exit 0
          fi
          set -euo pipefail
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'EOF'
          set -euo pipefail
          cd ./production
          TAG=${{ github.sha }} docker compose -f docker-compose.prod.yaml pull
          TAG=${{ github.sha }} docker compose -f docker-compose.prod.yaml up -d
          EOF
          echo "Deployment completed successfully."