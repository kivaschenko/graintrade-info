# PostgreSQL 16 Production Configuration - Optimized for Hetzner AX41-NVMe
# Generated for 64GB RAM, 6-core AMD Ryzen 5 3600

#=====================================================================
# CONNECTION SETTINGS
#=====================================================================

listen_addresses = '*'
port = 5432
max_connections = 150
superuser_reserved_connections = 5
unix_socket_directories = '/var/run/postgresql'
tcp_keepalives_idle = 900
tcp_keepalives_interval = 30
tcp_keepalives_count = 5

#=====================================================================
# MEMORY SETTINGS
#=====================================================================

shared_buffers = 24GB              # 25% of RAM - Increased from 16GB
effective_cache_size = 32GB        # 50% of RAM
work_mem = 256MB                   # (24GB / 150 / 4) ≈ 40MB, rounded to 256MB
maintenance_work_mem = 2GB         # For VACUUM, CREATE INDEX
max_prepared_transactions = 0

#=====================================================================
# WRITE-AHEAD LOG (WAL)
#=====================================================================

wal_level = replica
fsync = on
synchronous_commit = local          # Balance between safety and performance
full_page_writes = on
wal_log_hints = off
wal_compression = on               # Enable compression for network efficiency
wal_buffers = 64MB                 # Increased from -1 (automatic)

max_wal_size = 8GB                 # Increased from 4GB
min_wal_size = 1GB                 # Increased from 512MB
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9
checkpoint_flush_after = 256kB

#=====================================================================
# REPLICATION & ARCHIVE
#=====================================================================

archive_mode = off                 # Enable if you want WAL archiving
archive_command = ''
archive_timeout = 0

#=====================================================================
# QUERY TUNING
#=====================================================================

random_page_cost = 1.1             # NVMe is very fast compared to HDD (was 4.0)
effective_io_concurrency = 200     # NVMe supports high concurrency
join_collapse_limit = 12           # Allow more complex joins
from_collapse_limit = 12           # For subqueries
constraint_exclusion = partition   # Optimize partitioned tables

#=====================================================================
# PARALLEL QUERY EXECUTION
#=====================================================================

max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 3
max_parallel_workers = 6           # Equal to CPU cores (6-core Ryzen)
max_worker_processes = 6
parallel_leader_participation = on

#=====================================================================
# AUTOVACUUM
#=====================================================================

autovacuum = on
autovacuum_max_workers = 4         # Increased from 3
autovacuum_naptime = 30s           # More frequent checks
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1      # 10% of table size
autovacuum_analyze_scale_factor = 0.05    # 5% of table size
autovacuum_vacuum_cost_limit = 500        # Increased from -1 (2ms default)
autovacuum_vacuum_cost_delay = 1ms        # More aggressive
autovacuum_freeze_max_age = 200000000

#=====================================================================
# LOGGING & MONITORING
#=====================================================================

log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on
log_line_prefix = '%t [%p] %u@%d '
log_timezone = 'UTC'

# Query logging
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 500   # Log queries > 500ms (increased from 250ms)
log_statement = 'mod'              # Log DDL & DML (INSERT, UPDATE, DELETE)
log_duration = off
log_connections = on               # Track connection attempts
log_disconnections = on             # Track connection closures
log_lock_waits = on                # Log long lock waits

#=====================================================================
# STATISTICS
#=====================================================================

track_activities = on
track_activity_query_size = 2048   # Increased from 1024
track_counts = on
track_io_timing = on               # Monitor I/O performance
track_wal_io_timing = on           # Monitor WAL I/O
track_functions = 'all'            # Enable function-level statistics

stats_temp_directory = '/var/run/postgresql/pg_stat_tmp'

#=====================================================================
# STATEMENT-BASED REPLICATION
#=====================================================================

shared_preload_libraries = 'pg_stat_statements'

#=====================================================================
# CLIENT CONNECTIONS
#=====================================================================

search_path = '"$user", public'
default_transaction_isolation = 'read committed'
default_transaction_deferrable = off
statement_timeout = 0              # No timeout (set per-query if needed)
lock_timeout = 0                   # No timeout
idle_in_transaction_session_timeout = 600000  # 10 minutes

#=====================================================================
# VACUUM & CLEANUP
#=====================================================================

vacuum_cost_delay = 0              # Let autovacuum manage via cost_limit
vacuum_cost_page_hit = 1
vacuum_cost_page_miss = 2
vacuum_cost_page_dirty = 20
vacuum_cost_limit = 200
vacuum_defer_cleanup_age = 0

#=====================================================================
# LOAD BALANCING & POOLING
#=====================================================================

# Note: Use pgBouncer for connection pooling in production
# jit = on                          # Just-in-time compilation for complex queries

#=====================================================================
# PERFORMANCE HINTS FOR 6-CORE SYSTEM
#=====================================================================

# This configuration is optimized for:
# - 64 GB RAM
# - 6 CPU cores / 12 threads
# - 2x 512GB NVMe SSDs (high I/O concurrency)
# - Production workload with moderate-high concurrency
#
# Key tuning:
# 1. Increased shared_buffers to 24GB (was 16GB in stock config)
# 2. Set effective_cache_size to 32GB for query planner
# 3. More aggressive parallel query execution (all 6 cores utilized)
# 4. Optimized for NVMe storage (random_page_cost = 1.1)
# 5. Tuned autovacuum for continuous maintenance
# 6. Increased max_connections to 150
# 7. More aggressive connection activity logging
#
# IMPORTANT: After applying these changes:
# 1. Restart PostgreSQL service
# 2. Run: SELECT pg_reload_conf();
# 3. Monitor: SELECT * FROM pg_stat_statements ORDER BY mean_exec_time DESC LIMIT 10;
# 4. Check: pg_stat_database for cache_hit_ratio (should be > 99%)
