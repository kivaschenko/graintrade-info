name: Deploy GrainTrade

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: prod-deploy-main
  cancel-in-progress: false

env:
  REGISTRY: gitea.graintrade.info
  NAMESPACE: ${{ secrets.GITEA_REGISTRY_USERNAME }}
  TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.graintrade.info
          username: ${{ secrets.GITEA_REGISTRY_USERNAME }}
          password: ${{ secrets.GITEA_REGISTRY_TOKEN }}

      - name: Prepare frontend production env
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FRONTEND_ENV_PRODUCTION" > frontend/.env.production
        env:
          FRONTEND_ENV_PRODUCTION: ${{ secrets.FRONTEND_ENV_PRODUCTION }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: gitea.graintrade.info/${{ env.NAMESPACE }}/grain-backend:${{ env.TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: gitea.graintrade.info/${{ env.NAMESPACE }}/grain-frontend:${{ env.TAG }}

      - name: Build and push chat-room
        uses: docker/build-push-action@v6
        with:
          context: ./chat-room
          push: true
          tags: gitea.graintrade.info/${{ env.NAMESPACE }}/grain-chat-room:${{ env.TAG }}

      - name: Build and push notifications
        uses: docker/build-push-action@v6
        with:
          context: ./notifications
          push: true
          tags: gitea.graintrade.info/${{ env.NAMESPACE }}/grain-notifications:${{ env.TAG }}

      - name: Build and push data-pipeline
        uses: docker/build-push-action@v6
        with:
          context: ./data-pipeline
          push: true
          tags: gitea.graintrade.info/${{ env.NAMESPACE }}/grain-data-pipeline:${{ env.TAG }}

      - name: Build and push landing-service
        uses: docker/build-push-action@v6
        with:
          context: ./landing-service
          push: true
          tags: gitea.graintrade.info/${{ env.NAMESPACE }}/grain-landing-service:${{ env.TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to production
        shell: bash
        env:
          GITEA_REGISTRY_TOKEN: ${{ secrets.GITEA_REGISTRY_TOKEN }}
          GITEA_REGISTRY_USERNAME: ${{ secrets.GITEA_REGISTRY_USERNAME }}
          DEPLOY_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             echo \"${GITEA_REGISTRY_TOKEN}\" | docker login gitea.graintrade.info -u \"${GITEA_REGISTRY_USERNAME}\" --password-stdin
             cd /home/kivaschenko/production
             IMAGE_REGISTRY=gitea.graintrade.info IMAGE_NAMESPACE=${GITEA_REGISTRY_USERNAME} TAG=${DEPLOY_TAG} docker compose -f docker-compose.prod.yaml pull
             IMAGE_REGISTRY=gitea.graintrade.info IMAGE_NAMESPACE=${GITEA_REGISTRY_USERNAME} TAG=${DEPLOY_TAG} docker compose -f docker-compose.prod.yaml up -d"
