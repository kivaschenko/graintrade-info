name: Deploy to Azure

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches:
      - develop
      - main

env:
  REGISTRY: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
  RESOURCE_GROUP: graintrade-rg

jobs:
  # Job 1: Detect changed services
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
      chat-changed: ${{ steps.changes.outputs.chat }}
      notifications-changed: ${{ steps.changes.outputs.notifications }}
      data-pipeline-changed: ${{ steps.changes.outputs.data-pipeline }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'backend/**'
            chat:
              - 'chat-room/**'
            notifications:
              - 'notifications/**'
            data-pipeline:
              - 'data-pipeline/**'
            frontend:
              - 'frontend/**'

  # Job 2: Test Python services
  test-python:
    name: Test Python Services
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.backend-changed == 'true' ||
      needs.detect-changes.outputs.chat-changed == 'true' ||
      needs.detect-changes.outputs.notifications-changed == 'true' ||
      needs.detect-changes.outputs.data-pipeline-changed == 'true'
    strategy:
      matrix:
        service:
          - backend
          - chat-room
          - notifications
          - data-pipeline
        include:
          - service: backend
            path: ./backend
          - service: chat-room
            path: ./chat-room
          - service: notifications
            path: ./notifications
          - service: data-pipeline
            path: ./data-pipeline
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install -e . 2>/dev/null || echo "No requirements found"

      - name: Run linting
        working-directory: ${{ matrix.path }}
        continue-on-error: true
        run: |
          pip install pylint flake8
          flake8 app --max-line-length=120 --ignore=E501,W503 || true
          pylint app --disable=all --enable=F,E --exit-zero || true

      - name: Run pytest
        working-directory: ${{ matrix.path }}
        continue-on-error: true
        run: |
          pytest tests/ -v --tb=short 2>/dev/null || echo "No tests found"

  # Job 3: Test frontend
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linting
        working-directory: ./frontend
        continue-on-error: true
        run: npm run lint || true

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  # Job 4: Build and push Docker images
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [detect-changes, test-python, test-frontend]
    if: github.event_name == 'push'
    strategy:
      matrix:
        service:
          - backend
          - chat-room
          - notifications
          - data-pipeline
        include:
          - service: backend
            path: ./backend
            dockerfile: ./backend/Dockerfile
          - service: chat-room
            path: ./chat-room
            dockerfile: ./chat-room/Dockerfile
          - service: notifications
            path: ./notifications
            dockerfile: ./notifications/Dockerfile
          - service: data-pipeline
            path: ./data-pipeline
            dockerfile: ./data-pipeline/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.service }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log Docker image
        run: echo "Built and pushed ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"

  # Job 5: Deploy frontend to Static Web Apps
  deploy-frontend:
    name: Deploy Frontend to Static Web Apps
    runs-on: ubuntu-latest
    needs: [detect-changes, test-frontend]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.detect-changes.outputs.frontend-changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install and build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend/dist"
          output_location: ""
          skip_app_build: true

  # Job 6: Deploy Python services to App Service
  deploy-services:
    name: Deploy Services to App Service
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      matrix:
        service:
          - backend
          - chat-room
        include:
          - service: backend
            app_name: graintrade-backend
            image: backend
          - service: chat-room
            app_name: graintrade-chat
            image: chat-room
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ matrix.app_name }}
          images: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}

      - name: Verify deployment
        run: |
          az webapp show --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ matrix.app_name }} \
            --query "state" -o tsv

  # Job 7: Restart containers
  restart-containers:
    name: Restart Container Instances
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      (needs.detect-changes.outputs.notifications-changed == 'true' ||
       needs.detect-changes.outputs.data-pipeline-changed == 'true')
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart notifications container
        if: needs.detect-changes.outputs.notifications-changed == 'true'
        continue-on-error: true
        run: |
          az container restart --resource-group ${{ env.RESOURCE_GROUP }} \
            --name notifications-container

      - name: Restart data-pipeline container
        if: needs.detect-changes.outputs.data-pipeline-changed == 'true'
        continue-on-error: true
        run: |
          az container restart --resource-group ${{ env.RESOURCE_GROUP }} \
            --name data-pipeline-container

  # Job 8: Notify deployment status
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-services, deploy-frontend, restart-containers]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-services.result }}" = "success" ] || \
             [ "${{ needs.deploy-frontend.result }}" = "success" ]; then
            echo "✅ Deployment succeeded"
            exit 0
          else
            echo "⚠️ Deployment completed with warnings"
            exit 0
          fi

      - name: Notify on failure (optional)
        if: failure()
        run: |
          echo "❌ Deployment failed. Check logs for details."
          exit 1

  # Job 9: Security scanning (optional but recommended)
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
