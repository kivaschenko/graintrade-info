name: Deploy GrainTrade

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: prod-deploy-main
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare frontend production env
        shell: bash
        run: |
          set -euo pipefail
          cat > frontend/.env.production <<'EOF'
          ${{ secrets.FRONTEND_ENV_PRODUCTION }}
          EOF

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            docker.io/${{ env.NAMESPACE }}/grain-backend:${{ env.TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            docker.io/${{ env.NAMESPACE }}/grain-frontend:${{ env.TAG }}

      - name: Build and push chat-room
        uses: docker/build-push-action@v6
        with:
          context: ./chat-room
          push: true
          tags: |
            docker.io/${{ env.NAMESPACE }}/grain-chat-room:${{ env.TAG }}

      - name: Build and push notifications
        uses: docker/build-push-action@v6
        with:
          context: ./notifications
          push: true
          tags: |
            docker.io/${{ env.NAMESPACE }}/grain-notifications:${{ env.TAG }}

      - name: Build and push data-pipeline
        uses: docker/build-push-action@v6
        with:
          context: ./data-pipeline
          push: true
          tags: |
            docker.io/${{ env.NAMESPACE }}/grain-data-pipeline:${{ env.TAG }}

      - name: Build and push landing-service
        uses: docker/build-push-action@v6
        with:
          context: ./landing-service
          push: true
          tags: |
            docker.io/${{ env.NAMESPACE }}/grain-landing-service:${{ env.TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "ERROR: DEPLOY_HOST secret is not set"
            exit 1
          fi

          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "ERROR: DEPLOY_SSH_KEY secret is not set"
            exit 1
          fi

          if [ -z "${DEPLOY_PORT:-}" ]; then
            DEPLOY_PORT=22
          fi

          if ! [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || [ "$DEPLOY_PORT" -lt 1 ] || [ "$DEPLOY_PORT" -gt 65535 ]; then
            echo "ERROR: DEPLOY_PORT is invalid: '$DEPLOY_PORT'"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          echo "DEPLOY_PORT=$DEPLOY_PORT" >> "$GITHUB_ENV"

      - name: Deploy to production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ env.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "ERROR: DEPLOY_HOST secret is not set"
            exit 1
          fi

          if [ -z "${DEPLOY_USER:-}" ]; then
            echo "ERROR: DEPLOY_USER secret is not set"
            exit 1
          fi

          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "ERROR: Docker Hub secrets are not set"
            exit 1
          fi

          if [ -z "${DEPLOY_PORT:-}" ]; then
            DEPLOY_PORT=22
          fi

          IMAGE_TAG=${{ env.TAG }}

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" << EOF
          set -euo pipefail
          cd /home/$DEPLOY_USER/production

          echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

          # Fast validation: auth + repository/tag exists
          docker pull docker.io/$IMAGE_NAMESPACE/grain-backend:$IMAGE_TAG

          IMAGE_REGISTRY=docker.io IMAGE_NAMESPACE=$IMAGE_NAMESPACE TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yaml pull
          IMAGE_REGISTRY=docker.io IMAGE_NAMESPACE=$IMAGE_NAMESPACE TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yaml up -d
          EOF

