name: grain
services:
  backend:
    # Use Docker Hub image for production and a version tag for stability
    image: gitea.graintrade.info/kivaschenko/grain-backend:${BUILD_NUMBER:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    env_file:
      - ./envs/backend.env
    ports:
      - "8000:8000"
    networks:
      - grain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  chat-room:
    image: gitea.graintrade.info/kivaschenko/grain-chat-room:${BUILD_NUMBER:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    env_file:
      - ./envs/chat-room.env
    ports:
      - "8001:8001"
    networks:
      - grain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  notifications:
    image: gitea.graintrade.info/kivaschenko/grain-notifications:${BUILD_NUMBER:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    env_file:
      - ./envs/notifications.env
    ports:
      - "8002:8002"
    networks:
      - grain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  data-pipeline:
    image: gitea.graintrade.info/kivaschenko/grain-data-pipeline:${BUILD_NUMBER:-latest}
    restart: always
    env_file:
      - ./envs/data-pipeline.env
    ports:
      - "8004:8004"
    networks:
      - grain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: gitea.graintrade.info/kivaschenko/grain-frontend:${BUILD_NUMBER:-latest}
    restart: always
    env_file:
      - ./envs/frontend.env
    ports:
      - "8080:80"
    networks:
      - grain-network
    depends_on:
      - backend
      - chat-room
      - data-pipeline

  landing-service:
    image: gitea.graintrade.info/kivaschenko/grain-landing-service:${BUILD_NUMBER:-latest}
    restart: always
    ports:
      - "8003:8003"
    networks:
      - grain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

