[project]
name = "data-pipeline"
version = "0.1.0"
description = "Data ingestion, transformation, and analytics pipeline for commodity price prediction"
authors = [
    {name = "K. Ivashchenko", email = "civaschenko@yahoo.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.0,<1.0.0)",
    "uvicorn (>=0.32.0,<1.0.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "alembic (>=1.13.0,<2.0.0)",
    "pyspark (>=4.1.0,<5.0.0)",
    "delta-spark (>=4.0.0,<5.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "pydantic (>=2.10.0,<3.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "httpx (>=0.28.0,<1.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "boto3 (>=1.42.17,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "yfinance (>=1.0,<2.0)",
    "investpy (>=1.0.8,<2.0.0)",
    "aio-pika (>=9.5.8,<10.0.0)",
    "pyarrow (>=22.0.0,<23.0.0)",
    "fastparquet (>=2025.12.0,<2026.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=9.0.0,<10.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "black (>=24.0.0,<25.0.0)",
    "ruff (>=0.8.0,<1.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

