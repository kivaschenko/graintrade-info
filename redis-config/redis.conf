# Redis Configuration - Production Optimized for Hetzner AX41-NVMe
# Allocated: 4GB RAM, 0.5 CPU cores

################################## NETWORK #####################################

# Accept connections only on localhost if behind a proxy, or * for network access
bind 0.0.0.0

# TCP listen() backlog
tcp-backlog 511

# TCP keepalive
tcp-keepalive 300

# Close the connection after a client is idle for N seconds (0 = disabled)
timeout 0

################################# GENERAL #####################################

# Run in daemonized mode? No, Docker handles this
daemonize no

# Set the server verbosity to 'debug', 'verbose', 'notice', 'warning'
loglevel warning

# Specify the log file name
logfile ""

# Set the number of databases
databases 16

################################ SNAPSHOTTING #################################

# Save the DB on disk
save 900 1     # after 900 sec (15 min) if at least 1 key changed
save 300 10    # after 300 sec (5 min) if at least 10 keys changed
save 60 10000  # after 60 sec if at least 10000 keys changed

# By default Redis will stop accepting writes if RDB snapshots are enabled
# (at least one save point) and the latest background save has failed.
stop-writes-on-bgsave-error yes

# Compress string objects using LZF when dump .rdb databases
rdbcompression yes

# Checksum the RDB file
rdbchecksum yes

# The filename for the DB
dbfilename dump.rdb

# Working directory
dir ./

################################# REPLICATION #################################

# replicaof <masterip> <masterport>

# If the master is password protected (using the "requirepass" configuration
# directive below) it is possible to tell the replica to authenticate before
# starting the replication synchronization
# masterauth <master-password>

# When a replica loses its connection with the master, or when the replication
# is still in progress, the replica can act in two different ways:
replica-serve-stale-data yes

# Disable TCP_NODELAY on the replica socket after SYNC
repl-diskless-sync no

# Delay to use before freeing the RDB file when doing diskless sync
repl-diskless-sync-delay 5

# Replication backlog
repl-backlog-size 256mb
repl-backlog-ttl 3600

# Disable replica's CPU-bound intensive sorting algorithm
replica-lazy-free-pending-del no

################################## SECURITY ###################################

# Require a password
# requirepass yourpassword

# Set ACL list for fine-grained access control
# user default on >foobared ~* &* +@all

################################### CLIENTS ####################################

# Set the max number of connected clients
maxclients 10000

############################## MEMORY MANAGEMENT ###############################

# Set a memory usage limit
maxmemory 4gb

# Memory eviction policy for keys when max memory is reached
# Recommended: allkeys-lru (evict any key, use LRU)
maxmemory-policy allkeys-lru

# LRU samples for eviction
maxmemory-samples 5

# Lazily free the key/value pairs
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-free-pending-del yes
lazyfree-lazy-user-del yes

################################ LAZY FREEING ################################

lazyfree-lazy-user-flush yes

############################### THREADED I/O #################################

# I/O threading helps with high throughput Redis instances.
# By default threading is disabled (0 threads).
# For Hetzner AX41 with 6-core CPU, we can use 4 threads
io-threads 4

# Enable reading working with the threaded I/O
io-threads-do-reads yes

# Enable writing with the threaded I/O
io-threads-do-writes yes

############################# KERNEL OOM CONTROL ############################

# Enable system OOM killer
oom-score-adj no

############################ KERNEL TRANSPARENT HUGEPAGE #######################

# Enable/disable transparent HugePage
disable-thp yes

############################## PERSISTENCE #################################

# RDB + AOF hybrid mode (saves RDB when AOF fsync is about to happen)
aof-use-rdb-preamble yes

################################ REDIS MODULES ###############################

# loadmodule /path/to/my_module.so

################################## SLOW LOG ###################################

# Log queries slower than specified microseconds
slowlog-log-slower-than 10000

# Length of the slow log
slowlog-max-len 128

################################ LATENCY MONITOR ############################

# Enable latency monitoring
latency-monitor-threshold 0

################################ ADVANCED CONFIG ##########################

# Hash table settings for internal data structures
hash-max-listenpack-entries 512
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List compression
list-max-listenpack-size -2
list-compress-depth 0

# Set compression
set-max-intset-entries 512

# Sorted set compression
zset-max-listenpack-entries 128
zset-max-listenpack-value 64

# HyperLogLog
hll-sparse-max-bytes 3000

# Streams
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limit for different client types
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Frequency of active defragmentation check
active-defrag-ignore-bytes 100mb
active-defrag-ignore-age-factor 1.0

####################### LAZY FREEING OF EXPIRED KEYS ##########################

expire-lazy-evict no
expire-lazy-server-cleanup no

############################### EVENT NOTIFICATION #############################

notify-keyspace-events ""

############################## APPEND ONLY MODE ###############################

# Enable AOF (Append Only File) for persistence
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# fsync policy: always, everysec, no
appendfsync everysec

# Prevent heavy I/O during fsync
no-appendfsync-on-rewrite no

# Automatic rewrite of append only file
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load truncated AOF ignoring last incomplete command
aof-load-truncated yes

# Load an AOF using an RDB file
aof-use-rdb-preamble yes

################################## SHUTDOWN #####################################

# Honor the halt request from SHUTDOWN command
shutdown-on-sigterm default

############################ COMMAND RENAMING ############################

# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

# --- DO NOT RENAME PING --- needed for healthchecks
# rename-command PING ""

##################################### ACL LOG ##################################

acllog-max-len 128

###################### SAVE THE PREVIOUS CONFIG FILE ###################

# Important: When upgrading from older versions, Redis may fail to load
# if the configuration file contains options not recognized by that version.
# The line below tells Redis to continue even if it reads lines it doesn't understand.
#
# Note: This is already handled by Docker's base image.

############################### NOTES #########################################

# Configuration notes for Hetzner AX41-NVMe (64GB RAM, 6 cores):
#
# 1. maxmemory: 4GB - This is our allocated cache limit
# 2. maxmemory-policy: allkeys-lru - Evict least recently used keys when full
# 3. io-threads: 4 - Use 4 threads for I/O (less than CPU cores to not starve other services)
# 4. appendonly: yes - Write-through cache for reliability
# 5. appendfsync: everysec - Balance between performance and durability
# 6. tcp-backlog: 511 - Increased for high-traffic scenarios
# 7. maxclients: 10000 - Allow many connections
# 8. lazyfree-lazy-eviction: yes - Non-blocking eviction
#
# Performance Monitoring:
# - INFO stats - Check hit rate and memory usage
# - INFO memory - Check actual memory consumption
# - SLOWLOG GET 10 - Check slowest commands
# - COMMAND COUNT - Verify all commands are available
#
# Recommended Monitoring:
# - Check hit_rate (should be > 90% for cache)
# - Monitor used_memory_rss vs maxmemory
# - Watch evicted_keys (should be low if working set fits)
# - Monitor connected_clients
