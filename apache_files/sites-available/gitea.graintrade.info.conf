# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName gitea.graintrade.info
    Redirect permanent / https://gitea.graintrade.info/
RewriteEngine on
RewriteCond %{SERVER_NAME} =gitea.graintrade.info
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# Virtual Host for HTTPS traffic
<VirtualHost *:443>
    ServerName gitea.graintrade.info

    # Proxy settings
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://localhost:6543/
    ProxyPassReverse / http://localhost:6543/

    # You will need to obtain a new SSL certificate for api.graintrade.info
    # These lines will be automatically added by Certbot later.
    SSLEngine on
    # Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/gitea.graintrade.info/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/gitea.graintrade.info/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
