<VirtualHost *:80>
    ServerName airflow.graintrade.info
    ServerAlias www.airflow.graintrade.info

    ProxyPreserveHost On
    ProxyPass / http://localhost:8888/
    ProxyPassReverse / http://localhost:8888/

    ErrorLog ${APACHE_LOG_DIR}/airflow_error.log
    CustomLog ${APACHE_LOG_DIR}/airflow_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName airflow.graintrade.info
    ServerAlias www.airflow.graintrade.info

    ProxyPreserveHost On
    ProxyPass / http://localhost:8888/
    ProxyPassReverse / http://localhost:8888/

    # You will need to obtain a new SSL certificate for airflow.graintrade.info
    # These lines will be automatically added by Certbot later.
    SSLEngine on
    # Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/airflow.graintrade.info/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/airflow.graintrade.info/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog ${APACHE_LOG_DIR}/airflow_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/airflow_ssl_access.log combined
</VirtualHost>