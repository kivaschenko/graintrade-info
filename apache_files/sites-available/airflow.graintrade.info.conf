<VirtualHost *:80>
    ServerName airflow.graintrade.info
    ServerAlias www.airflow.graintrade.info

    # Simple redirect is cleaner than RewriteRules for basic HTTPS enforcement
    Redirect permanent / https://airflow.graintrade.info/
</VirtualHost>

<VirtualHost *:443>
    ServerName airflow.graintrade.info
    ServerAlias www.airflow.graintrade.info

    ProxyPreserveHost On
    ProxyRequests Off

    # Ensure Airflow's Webserver port matches (usually 8080)
    ProxyPass / http://localhost:8080/
    ProxyPassReverse / http://localhost:8080/

    SSLEngine on
    # Once Certbot runs, it will uncomment/add these lines:
    # SSLCertificateFile /etc/letsencrypt/live/airflow.graintrade.info/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/airflow.graintrade.info/privkey.pem
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog ${APACHE_LOG_DIR}/airflow_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/airflow_ssl_access.log combined
</VirtualHost>
