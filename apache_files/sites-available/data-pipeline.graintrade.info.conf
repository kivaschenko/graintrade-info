<VirtualHost *:80>
    ServerName data-pipeline.graintrade.info
    Redirect permanent / https://data-pipeline.graintrade.info/
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =data-pipeline.graintrade.info
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName data-pipeline.graintrade.info

    # Proxy settings
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://localhost:8004/
    ProxyPassReverse / http://localhost:8004/

    # You will need to obtain a new SSL certificate for data-pipeline.graintrade.info
    # These lines will be automatically added by Certbot later.
    SSLEngine on
    # Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/data-pipeline.graintrade.info/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/data-pipeline.graintrade.info/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>