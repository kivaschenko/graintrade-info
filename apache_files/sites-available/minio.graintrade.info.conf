<VirtualHost *:80>
    ServerName minio.graintrade.info
    ServerAlias www.minio.graintrade.info

    # Simple redirect is cleaner than RewriteRules for basic HTTPS enforcement
    Redirect permanent / https://minio.graintrade.info/
</VirtualHost>

<VirtualHost *:443>
    ServerName minio.graintrade.info
    ServerAlias www.minio.graintrade.info

    ProxyPreserveHost On
    ProxyRequests Off

    # Ensure MinIO's Console or API port matches (usually 9000 for API, 9001 for Console)
    ProxyPass / http://localhost:9001/
    ProxyPassReverse / http://localhost:9001/

    SSLEngine on
    # Once Certbot runs, it will uncomment/add these lines:
    # SSLCertificateFile /etc/letsencrypt/live/minio.graintrade.info/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/minio.graintrade.info/privkey.pem
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog ${APACHE_LOG_DIR}/minio_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/minio_ssl_access.log combined
</VirtualHost>
