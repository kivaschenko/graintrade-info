# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName jenkins.graintrade.info
    Redirect permanent / https://jenkins.graintrade.info/
RewriteEngine on
RewriteCond %{SERVER_NAME} =jenkins.graintrade.info
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# Virtual Host for HTTPS traffic
<VirtualHost *:443>
    ServerName jenkins.graintrade.info

    # Proxy settings
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://localhost:8888/
    ProxyPassReverse / http://localhost:8888/
    AllowEncodedSlashes NoDecode

    # You will need to obtain a new SSL certificate for jenkins.graintrade.info
    # These lines will be automatically added by Certbot later.
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/jenkins.graintrade.info/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/jenkins.graintrade.info/privkey.pem

    # Required for Jenkins websocket agents
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket
    RewriteCond %{HTTP:Connection} upgrade
    RewriteRule ^/?(.*) "ws://localhost:8888/$1" [P,L]
</VirtualHost>
# Local reverse proxy authorization override
# Most unix distribution deny proxy by default
# See /etc/apache2/mods-enabled/proxy.conf in Ubuntu
<Proxy http://localhost:8888/>
    Order deny,allow
    Allow from all
</Proxy>
# End of file apache_files/sites-available/jenkins.graintrade.info.conf