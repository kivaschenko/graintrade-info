<VirtualHost *:80>
    ServerName coder.graintrade.info
    Redirect permanent / https://api.graintrade.info/
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName coder.graintrade.info

    SSLEngine on

    ErrorLog ${APACHE_LOG_DIR}/coder_error.log
    CustomLog ${APACHE_LOG_DIR}/coder_access.log combined

    ProxyRequests Off
    ProxyPreserveHost On

    # Coder requires WebSockets for terminal and VS Code connections; 
    # 'upgrade=any' handles this natively in modern Apache.
    ProxyPass / http://127.0.0.1:7080/ upgrade=any
    ProxyPassReverse / http://127.0.0.1:7080/
SSLCertificateFile /etc/letsencrypt/live/coder.graintrade.info/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/coder.graintrade.info/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
