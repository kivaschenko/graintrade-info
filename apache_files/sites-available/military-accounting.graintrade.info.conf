<VirtualHost *:80>
	ServerName military-accounting.graintrade.info
	RewriteEngine On
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName military-accounting.graintrade.info

	SSLEngine on
	SSLCertificateFile /etc/letsencrypt/live/military-accounting.graintrade.info/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/military-accounting.graintrade.info/privkey.pem
	Include /etc/letsencrypt/options-ssl-apache.conf

	ProxyPreserveHost On
	ProxyRequests Off
	RequestHeader set X-Forwarded-Proto "https"
	RequestHeader set X-Forwarded-Port "443"

	# protect the site with Basic Auth for one user only
	<Location />
	    AuthType Basic
	    AuthName "restricted Area - Military Acounting"
	    AuthUserFile /etc/apache2/.htpasswd_military
	    Require user svitlana

	    # Note: The target path '/' is omitted here when inside <Location />
	    ProxyPass http://127.0.0.1:5000/
	    ProxyPassReverse http://127.0.0.1:5000/
	</Location>
	ErrorLog ${APACHE_LOG_DIR}/military-accounting-error.log
	CustomLog ${APACHE_LOG_DIR}/military-accounting-access.log combined
</VirtualHost>
</IfModule>
